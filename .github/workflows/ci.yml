name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Required for Next.js build — Supabase public vars don't need secrets
  NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  # Dummy values so build doesn't fail on missing optional env vars
  ENCRYPTION_KEY:                ${{ secrets.ENCRYPTION_KEY || 'ci-dummy-32-byte-encryption-key1' }}

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Supabase types
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: |
          npx supabase gen types typescript \
            --project-id "$(echo $NEXT_PUBLIC_SUPABASE_URL | sed 's|https://||; s|\.supabase\.co.*||')" \
            > lib/supabase/database.types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: TypeScript type check
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
